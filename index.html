<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genesis: co-op puzzle platformer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%231d1b3a'/><rect x='1' y='2' width='6' height='5' rx='1' fill='%2386b35e'/><rect x='2' y='3' width='1' height='1' fill='%23fff'/><rect x='5' y='3' width='1' height='1' fill='%23fff'/><rect x='2' y='5' width='1' height='1' fill='%23fff'/><rect x='5' y='5' width='1' height='1' fill='%23fff'/></svg>" />
  </head>
  <body>
    <div id="game"></div>

    <section id="lobby">
      <div class="lobby-card">
        <h1>GENESIS</h1>
        <p class="tag">A co-op puzzle platformer. Nobody gets through alone.</p>
        <label>Your name<input id="name" maxlength="14" placeholder="Player" autocomplete="off" /></label>
        <div class="pick-label">Choose your character</div>
        <div id="pick" role="radiogroup" aria-label="Character"></div>
        <button id="create" class="primary">Create room</button>
        <div class="or"><span>or join a friend</span></div>
        <div class="row">
          <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" />
          <button id="join">Join</button>
        </div>
        <p id="lobby-error" role="alert"></p>
      </div>
    </section>

    <section id="hud" hidden>
      <div id="hud-left">
        <div id="room-box">
          <span>ROOM</span><b id="room-code"></b>
          <button id="copy-link" title="Copy invite link">Copy invite</button>
        </div>
        <ul id="party"></ul>
      </div>
      <div id="level-name"></div>
      <div id="help"></div>
      <div id="banner"></div>
      <ul id="feed"></ul>
      <div id="restart"><span>Restarting…</span><div><i id="restart-fill"></i></div></div>
    </section>

    <div id="reconnecting" hidden>Connection dropped: reconnecting to your slot…</div>
    <div id="conn" hidden>
      <p>
        <span id="conn-msg">Connection lost.</span>
        <button onclick="location.reload()">Try again</button>
        <button id="conn-lobby" hidden>Back to lobby</button>
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
